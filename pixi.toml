[workspace]
authors = ["Justus Magin <keewis@posteo.de>"]
channels = ["conda-forge"]
name = "slurm-client"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
asyncssh = ">=2.22.0,<3"
httpx = ">=0.28.1,<0.29"
h2 = ">=4.3.0,<5"
socksio = ">=1.0.0,<2"
textual = ">=8.2.4,<9"

[feature.py313.dependencies]
python = "3.13.*"

[feature.docs.dependencies]
sphinx = "*"
furo = "*"

[feature.dev.dependencies]
black = "*"
pyinstrument = "*"
ipython = "*"
ipdb = "*"

[environments]
docs = ["docs", "py313"]
default = ["dev", "py313"]
